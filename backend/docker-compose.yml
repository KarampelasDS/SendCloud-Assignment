services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: shipments
      POSTGRES_PASSWORD: shipments
      POSTGRES_DB: shipments
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipments"]
      interval: 3s
      retries: 10

  create-test-db:
    image: postgres:17
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: shipments
    entrypoint:
      ["sh", "-c", "createdb -h db -U shipments shipments_test || true"]

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://shipments:shipments@db:5432/shipments
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://shipments:shipments@db:5432/shipments
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: "python -m app.worker"
    environment:
      DATABASE_URL: postgresql+psycopg://shipments:shipments@db:5432/shipments
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
