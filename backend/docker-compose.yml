services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: shipments
      POSTGRES_PASSWORD: shipments
      POSTGRES_DB: shipments
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  adminer:
    image: adminer
    ports:
      - "8080:8080"

volumes:
  pgdata:
